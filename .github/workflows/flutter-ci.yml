name: flutter-ci

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flutter:
    runs-on: ubuntu-latest
    env:
      CI: true
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true
      - name: Ensure Android platform exists
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name nid_mobile .
          fi
      - name: Patch Android compileSdkVersion
        env:
          COMPILE_SDK_VERSION: 36
        run: |
          # Set explicit SDK versions in android/app/build.gradle.
          # compileSdk 36: satisfies flutter_tts (SDK 36) and flutter_plugin_android_lifecycle (SDK 35).
          # This replaces the flutter.compileSdkVersion / flutter.targetSdkVersion references
          # which are not always resolvable in all Gradle plugin contexts.
          APP_GRADLE="android/app/build.gradle"
          if [ -f "$APP_GRADLE" ]; then
            sed -i "s/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion ${COMPILE_SDK_VERSION}/" "$APP_GRADLE"
            sed -i "s/compileSdk flutter\.compileSdkVersion/compileSdk ${COMPILE_SDK_VERSION}/" "$APP_GRADLE"
            sed -i "s/targetSdkVersion flutter\.targetSdkVersion/targetSdkVersion ${COMPILE_SDK_VERSION}/" "$APP_GRADLE"
            sed -i "s/targetSdk flutter\.targetSdkVersion/targetSdk ${COMPILE_SDK_VERSION}/" "$APP_GRADLE"
            # Ensure minSdk is at least 21
            sed -i 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 21/' "$APP_GRADLE"
            sed -i 's/minSdk flutter\.minSdkVersion/minSdk 21/' "$APP_GRADLE"
          fi
      - name: Configure development fallback values
        run: |
          if [ -z "${API_BASE_URL}" ]; then
            echo "API_BASE_URL=http://10.0.2.2:4000/api" >> "$GITHUB_ENV"
            echo "Using development fallback API_BASE_URL."
          fi
      - run: flutter pub get
      - name: Patch speech_to_text pub-cache build.gradle
        env:
          COMPILE_SDK_VERSION: 36
        run: |
          STT_GRADLE="${HOME}/.pub-cache/hosted/pub.dev/speech_to_text-7.4.0/android/build.gradle"
          if [ -f "$STT_GRADLE" ]; then
            echo "--- Before patch (relevant lines) ---"
            grep -n "compileSdk\|ndkVersion" "$STT_GRADLE" || true
            sed -i "s/compileSdk = flutter\.compileSdkVersion/compileSdk = ${COMPILE_SDK_VERSION}/" "$STT_GRADLE"
            sed -i "/ndkVersion = flutter\.ndkVersion/d" "$STT_GRADLE"
            echo "--- After patch ---"
            grep -n "compileSdk\|ndkVersion" "$STT_GRADLE" || true
            # Verify no flutter.compileSdkVersion or flutter.ndkVersion remains
            if grep -q "flutter\.compileSdkVersion\|flutter\.ndkVersion" "$STT_GRADLE"; then
              echo "ERROR: flutter.compileSdkVersion or flutter.ndkVersion still present in $STT_GRADLE"
              exit 1
            fi
            echo "Patch applied successfully."
          else
            echo "WARNING: $STT_GRADLE not found; skipping patch."
          fi
      - run: flutter analyze
      - run: flutter test
      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL="${API_BASE_URL}"
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nid-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
