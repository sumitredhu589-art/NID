name: flutter-ci

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flutter:
    runs-on: ubuntu-latest
    env:
      CI: true
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true
      - name: Ensure Android platform exists
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name nid_mobile .
          fi
      - name: Patch Android compileSdkVersion
        env:
          COMPILE_SDK_VERSION: 36
        run: |
          # Patch explicit SDK versions in android/app/build.gradle.
          # compileSdk 36: satisfies flutter_tts (SDK 36) and flutter_plugin_android_lifecycle (SDK 35).
          # Use a broad replacement that handles both `compileSdk flutter.X` and `compileSdk = flutter.X`.
          APP_GRADLE="android/app/build.gradle"
          if [ -f "$APP_GRADLE" ]; then
            sed -i "s/flutter\.compileSdkVersion/${COMPILE_SDK_VERSION}/g" "$APP_GRADLE"
            sed -i "s/flutter\.targetSdkVersion/${COMPILE_SDK_VERSION}/g" "$APP_GRADLE"
            sed -i "s/flutter\.minSdkVersion/21/g" "$APP_GRADLE"
            sed -i "s/flutter\.ndkVersion/\"27.0.12077973\"/g" "$APP_GRADLE"
          fi
      - name: Configure development fallback values
        run: |
          if [ -z "${API_BASE_URL}" ]; then
            echo "API_BASE_URL=http://10.0.2.2:4000/api" >> "$GITHUB_ENV"
            echo "Using development fallback API_BASE_URL."
          fi
      - run: flutter pub get
      - name: Patch plugin build.gradle files
        run: |
          # Patch pub-cache plugin build.gradle files that reference flutter.* properties
          # (compileSdkVersion, targetSdkVersion, minSdkVersion, ndkVersion).
          # speech_to_text 7.x references flutter.compileSdkVersion AND flutter.ndkVersion.
          # The `|| true` prevents failure if no files are found.
          find "$HOME/.pub-cache" -name "build.gradle" -print0 \
            | xargs -0 sed -i \
                -e "s/flutter\.compileSdkVersion/36/g" \
                -e "s/flutter\.targetSdkVersion/36/g" \
                -e "s/flutter\.minSdkVersion/21/g" \
                -e "s/flutter\.ndkVersion/\"27.0.12077973\"/g" \
            2>/dev/null || true
      - run: flutter analyze
      - run: flutter test
      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL="${API_BASE_URL}"
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nid-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
