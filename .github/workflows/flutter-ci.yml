name: flutter-ci

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flutter:
    runs-on: ubuntu-latest
    env:
      CI: true
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true
      - name: Ensure Android platform exists
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name nid_mobile .
          fi
      - name: Set explicit compileSdkVersion 35 in app build.gradle
        run: |
          sed -i 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 35/' android/app/build.gradle
          sed -i 's/compileSdk flutter\.compileSdkVersion/compileSdk 35/' android/app/build.gradle
      - name: Configure development fallback values
        run: |
          if [ -z "${API_BASE_URL}" ]; then
            echo "API_BASE_URL=http://10.0.2.2:4000/api" >> "$GITHUB_ENV"
            echo "Using development fallback API_BASE_URL."
          fi
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL="${API_BASE_URL}"
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nid-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
