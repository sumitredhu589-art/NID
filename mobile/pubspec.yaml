name: nid_mobile
description: NID Flutter mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  geolocator: ^12.0.0
  camera: ^0.11.0+2
  image_picker: ^1.1.2

dependency_overrides:
  # Pinned to 4.6.1 because 4.6.2 has a broken build.gradle that references
  # flutter.compileSdkVersion, causing "Could not get unknown property 'flutter'".
  # Remove this override once the upstream issue in geolocator_android is fixed.
  geolocator_android: 4.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
